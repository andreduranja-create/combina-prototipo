x}.tags span{padding:7px 10px;border-radius:30px;background:var(--elev);font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--stroke);border-bottom:1px solid var(--stroke);padding:12px 0}.stats div{text-align:center}.stats div+div{border-left:1px solid var(--stroke)}.stats b{display:block;font-size:21px}.stats small{font-size:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.xp{background:var(--elev);border-radius:16px;padding:15px;display:grid;gap:10px}.progress{height:8px;background:#7775;border-radius:20px;overflow:hidden}.progress span{display:block;background:var(--lime);height:100%;width:68%}.toplist{display:grid;grid-template-columns:1fr 1fr;gap:9px}.topitem{background:var(--surface);border:1px solid var(--stroke);border-radius:16px;overflow:hidden}.topitem img{width:100%;height:114px;object-fit:cover;background:var(--elev)}.topitem .body{padding:10px;display:grid;gap:4px}.topitem strong{font-size:11px}.seg{display:flex;gap:7px}.seg button{flex:1;background:var(--surface);border:1px solid var(--stroke);border-radius:12px;padding:11px 6px;color:var(--fg);font-weight:700;font-size:12px}.seg button.on{background:var(--cta);color:var(--ctatext);border-color:var(--cta)}.review{background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:14px;display:grid;gap:11px}.review .meta{display:flex;justify-content:space-between;align-items:start}.stars{color:var(--gold);font-size:14px}.metrics{display:flex;gap:17px;font-size:12px;color:var(--muted);border-top:1px solid var(--stroke);padding-top:11px}.metric{display:flex;gap:5px;align-items:center}.flexbetween{display:flex;align-items:center;justify-content:space-between;gap:8px}.menuitem{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--stroke);border-radius:15px;padding:17px;font-size:14px;font-weight:700}.menuitem span{color:var(--lime);font-size:22px}.field {id:'severo',name:'Severo Burger',cat:'Hambúrguer',area:'Porto Alegre',image:'photo-1568901346375-23c9450c58cd',emoji:'🍔',desc:'Hambúrgueres e experiências descontraídas.'},

];

const storageKey='cmb-demo-v1';let stored={};try{stored=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}

const app=document.getElementById('app');function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function persist(){try{localStorage.setItem(storageKey,JSON.stringify({night:state.night,favs:state.favs,profile:state.profile,unread:state.unread,social:state.social,private:state.private}))}catch(e){}}
function imgUrl(p,w=520){return `https://images.unsplash.com/${p.image}?auto=format&fit=crop&w=${w}&q=75`}

function photo(p,w=520){return `<img class="photo" loading="lazy" src="${imgUrl(p,w)}" alt="Fotografia gastronômica ilustrativa de ${h(p.cat)}" data-fallback="${fallback(p.emoji)}">`}

function filtered(){return PLACES.filter(p=>(state.cat==='Todos'||p.cat===state.cat)&&(`${p.name} ${p.cat} ${p.area}`.toLowerCase().includes(state.search.toLowerCase()))&&(state.tab!=='Salvos'||state.favs.includes(p.id)))}

function explore(){const items=filtered();return `<div><h1>${state.tab==='Explorar'?'Explorar ✦':'Meus salvos ♡'}</h1><p class="hint">${state.tab==='Explorar'?'Descubra lugares que combinam com você.':'Seus lugares favoritos em Porto Alegre.'}</p></div>${state.tab==='Explorar'?`<label class="search"><span>⌕</span><input id="search" placeholder="Buscar restaurante ou bairro..." autocomplete="off" value="${h(state.search)}" aria-label="Buscar estabelecimento"></label><div class="cats">${['Todos','Pizza','Cafés','Italiana','Hambúrguer','Brunch','Bares'].map(c=>`<button class="cat ${state.cat===c?'on':''}" data-action="cat" data-id="${c}">${c}</button>`).join('')}</div>`:''}<div class="sectionhead"><h2>Estabelecimentos</h2><small>${items.length} lugares</small></div><div class="items" id="results">${items.length?items.map(venue).join(''):`<div class="empty">Nenhum estabelecimento encontrado.<br><br><button class="btn" data-action="reset">Ver todos</button></div>`}</div>${state.detail&&PLACES.some(p=>p.id===state.detail)?`<div class="detail"><div class="flexbetween"><h3>${h(PLACES.find(p=>p.id===state.detail).name)}</h3><button class="btn outline small" data-action="closeDetail">Fechar</button></div><p>${h(PLACES.find(p=>p.id===state.detail).desc)}</p><small>Horários e avaliações reais não estão conectados.</small></div>`:''}<div class="disclaimer">Fotografias reais de bancos de imagens, apenas ilustrativas. Não representam necessariamente os estabelecimentos citados.</div>`}
function profile(){const p=state.profile;const ordered=state.sort==='recent'?REVIEWS:[...REVIEWS].sort((a,b)=>(b.likes+b.comments+b.shares)-(a.likes+a.comments+a.shares));return `<section class="panel"><div class="profiletop"><div class="avatar">${h(p.name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase())}</div><div><h2>${h(p.name)}</h2><small>@${h(p.username)}</small><div class="level">✦ Exploradora local · nível 8</div></div></div><p class="bio">${h(p.bio)}</p><span class="location">⌖ ${h(p.city)}</span><div><strong style="font-size:12px">Combina comigo</strong><div class="tags" style="margin-top:9px">${p.interests.map(t=>`<span>${h(t)}</span>`).join('')}</div></div><div class="stats"><div><b>128</b><small>Publicações</small></div><div><b>842</b><small>Seguidores</small></div><div><b>376</b><small>Seguindo</small></div></div><div class="actions"><button class="btn" data-action="edit">Editar perfil</button><button class="btn outline" data-action="share">Compartilhar</button></div></section><div class="xp"><div class="flexbetween"><strong>🏅 Rumo ao nível 9</strong><small>680 / 1.000 XP</small></div><div class="progress"><span></span></div><small>Faltam 320 XP para o próximo nível.</small></div><div class="sectionhead"><h2>Meu top 5</h2><button class="btn outline small" data-action="top">Ver todos</button></div><div class="toplist">${PLACES.slice(0,2).map((x,i)=>`<div class="topitem"><img src="${imgUrl(x,360)}" loading="lazy" data-fallback="${fallback(x.emoji)}" alt="Imagem gastronômica ilustrativa"><div class="body"><strong>0${i+1} · ${h(x.name)}</strong><small>${x.cat}</small></div></div>`).join('')}</div><h2>Minhas avaliações</h2><div class="seg"><button class="${state.sort==='recent'?'on':''}" data-action="sort" data-id="recent">Últimas</button><button class="${state.sort==='popular'?'on':''}" data-action="sort" data-id="popular">Mais engajamento</button></div><small>${state.sort==='popular'?'Ordenadas pela soma de curtidas, comentários e compartilhamentos.':'Ordenadas da mais recente para a mais antiga.'}</small>${(state.allReviews?ordered:ordered.slice(0,2)).map(r=>`<article class="review"><div class="meta"><div><h3>${h(r.name)}</h3><small>${r.date}</small><div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div></div>${state.sort==='popular'&&r===ordered[0]?'<span>🏆</span>':''}</div><p class="bio">“${h(r.text)}”</p><div class="metrics"><span class="metric">♡ ${r.likes}</span><span class="metric">☏ ${r.comments}</span><span class="metric">↗ ${r.shares}</span><button class="btn outline small" data-action="review" data-id="${r.id}" style="margin-left:auto">Detalhes</button></div>${state.detail===r.id?`<div class="detail"><strong>${r.likes+r.comments+r.shares} interações</strong><small>Dados demonstrativos de engajamento.</small></div>`:''}</article>`).join('')}<button class="btn outline full" data-action="allreviews">${state.allReviews?'Mostrar menos':'Ver todas as avaliações'}</button><p class="disclaimer">Perfil, avaliações e métricas sociais são fictícios.</p>`}
function settings(){return `<button class="back" data-action="back">‹ Voltar ao perfil</button><h1>Configurações</h1><p class="hint">Gerencie seus dados e preferências.</p><h2>Minha conta</h2><button class="menuitem" data-action="edit"><span>✎</span><div>Editar perfil<br><small>Nome, biografia, cidade e interesses</small></div><span style="margin-left:auto">›</span></button><h2>Preferências</h2><div class="panel"><label class="toggleline">Modo After Dark <input type="checkbox" data-setting="night" ${state.night?'checked':''}></label><label class="toggleline">Notificações sociais <input type="checkbox" data-setting="social" ${state.social?'checked':''}></label><label class="toggleline">Perfil privado <input type="checkbox" data-setting="private" ${state.private?'checked':''}></label></div><p class="disclaimer">Preferências locais, exclusivas deste navegador.</p>`}
function edit(){const p=state.draft;return `<button class="back" data-action="settings">‹ Configurações</button><h1>Editar perfil</h1><div class="panel"><label class="field">Nome <input id="edit-name" maxlength="55" value="${h(p.name)}"></label><label class="field">Usuário <input id="edit-username" maxlength="35" value="${h(p.username)}"></label><label class="field">Biografia <textarea id="edit-bio" rows="4" maxlength="220">${h(p.bio)}</textarea></label><label class="field">Cidade <input id="edit-city" maxlength="65" value="${h(p.city)}"></label><div class="field">Combina comigo</div><div class="tags" id="interest-options">${['Italiana','Cafés','Brunch','Pizza','Hambúrguer','Bares','Japonesa'].map(c=>`<button class="chip ${p.interests.includes(c)?'on':''}" data-action="interest" data-id="${c}">${c}</button>`).join('')}</div><button class="btn full" data-action="saveProfile">Salvar alterações</button><button class="btn outline full" data-action="settings">Cancelar</button></div>`}
function notifications(){return `<div class="flexbetween"><h1>Notificações</h1><button class="btn outline small" data-action="read">Marcar lidas</button></div>${[['🏆','Nova conquista disponível','Você está perto do nível 9.'],['♡','Curtidas na avaliação','Sua publicação recebeu interações.'],['☏','Novo comentário','Alguém comentou sua experiência.']].map(n=>`<div class="notice"><strong>${n[0]} ${n[1]}</strong><small>${n[2]}</small></div>`).join('')}<p class="disclaimer">Notificações demonstrativas.</p><button class="btn outline" data-action="back">Voltar ao perfil</button>`}
function renderTopFive(){return `<button class="back" data-action="back">‹ Voltar ao perfil</button><h1>Meu top 5</h1>${PLACES.slice(0,5).map((p,i)=>`<div class="place">${photo(p,220)}<div><h3>${i+1}. ${h(p.name)}</h3><small>${p.cat}</small></div></div>`).join('')}`}
function section(){if(state.tab==='Explorar'||state.tab==='Salvos')return explore();if(state.tab==='Mapa')return `<h1>Mapa</h1><div class="empty">🗺️<br><br>Mapa interativo previsto para a próxima etapa.<br><br><button class="btn" data-action="explore">Explorar estabelecimentos</button></div>`;if(state.tab==='Criar')return `<h1>Nova publicação</h1><p class="hint">Compartilhe suas descobertas gastronômicas.</p><label class="field">Sua experiência<textarea id="new-post" rows="6" placeholder="Qual lugar combinou com você?">${h(state.post)}</textarea></label><button class="btn full" data-action="post">Continuar</button><p class="disclaimer">O protótipo não publica dados online.</p>`;if(state.section==='settings')return settings();if(state.section==='edit')return edit();if(state.section==='notifications')return notifications();if(state.section==='top')return renderTopFive();if(state.section==='share')return `<button class="back" data-action="back">‹ Voltar</button><h1>Compartilhar perfil</h1><p class="hint">Perfil fictício de demonstração.</p><button class="btn" data-action="copy">Copiar link demonstrativo</button>`;return profile()}
function render(keepScroll=false){const y=keepScroll?(app.querySelector('.scroll')?.scrollTop||0):0;app.className=state.night?'night':'day';app.innerHTML=`<header class="top"><div class="brand">Combina<b>?</b></div><div class="controls"><button class="mode" data-action="theme" title="Alternar aparência">${state.night?'☾ After Dark':'☀ Day'}</button><button class="iconbutton" data-action="notifications" aria-label="Notificações">${icon('bell')}${state.unread?`<span class="dot">${state.unread}</span>`:''}</button><button class="iconbutton" data-action="settings" aria-label="Configurações">${icon('settings')}</button></div></header><main class="scroll"><div class="content">${section()}</div></main><nav class="bottom" aria-label="Navegação principal">${[['Explorar','search'],['Mapa','map'],['Criar','plus'],['Salvos','bookmark'],['Perfil','user']].map(([t,i])=>`<button class="nav ${state.tab===t?'active':''} ${t==='Criar'?'create':''}" data-action="nav" data-id="${t}" aria-label="${t}">${t==='Criar'?`<span class="plus">${icon('plus')}</span>`:`${icon(i)}<span>${t}</span>`}</button>`).join('')}</nav>`;app.querySelector('.scroll').scrollTop=y;app.querySelectorAll('img[data-fallback]').forEach(im=>im.addEventListener('error',()=>{if(!im.dataset.tried){im.dataset.tried='1';im.src=im.dataset.fallback}}))}
function toast(s){const old=app.querySelector('.floating');if(old)old.remove();const t=document.createElement('div');t.className='floating';t.textContent=s;app.appendChild(t);setTimeout(()=>t.remove(),2600)}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;if(act==='nav'){state.tab=id;state.section='main';state.detail=null;render();return}if(act==='theme'){state.night=!state.night;persist();render(true);return}if(act==='settings'||act==='notifications'){state.tab='Perfil';state.section=act;render();return}if(act==='back'){state.tab='Perfil';state.section='main';render();return}if(act==='cat'){state.cat=id;render(true);return}if(act==='reset'||act==='explore'){state.tab='Explorar';state.cat='Todos';state.search='';render();return}if(act==='fav'){state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];persist();render(true);return}if(act==='detail'||act==='review'){state.detail=state.detail===id?null:id;render(true);return}if(act==='closeDetail'){state.detail=null;render(true);return}if(act==='sort'){state.sort=id;state.allReviews=false;state.detail=null;render(true);return}if(act==='allreviews'){state.allReviews=!state.allReviews;render(true);return}if(act==='edit'){state.draft=JSON.parse(JSON.stringify(state.profile));state.tab='Perfil';state.section='edit';render();return}if(act==='interest'){state.draft.interests=state.draft.interests.includes(id)?state.draft.interests.filter(x=>x!==id):[...state.draft.interests,id];render(true);return}if(act==='saveProfile'){const n=app.querySelector('#edit-name').value.trim(),u=app.querySelector('#edit-username').value.trim().replace(/^@/,'');if(!n||!u){toast('Preencha o nome e o usuário.');return}state.profile={...state.draft,name:n,username:u,bio:app.querySelector('#edit-bio').value,city:app.querySelector('#edit-city').value.trim()};state.section='main';persist();render();toast('Perfil atualizado neste navegador.');return}if(act==='read'){state.unread=0;persist();render(true);return}if(act==='top'||act==='share'){state.section=act;render();return}if(act==='copy'){try{await navigator.clipboard.writeText('https://combina.app/u/ana.explora');toast('Link fictício copiado.')}catch(e){toast('Link fictício: combina.app/u/ana.explora')}return}if(act==='post'){toast('Publicação online indisponível nesta demonstração.');return}});
app.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const list=app.querySelector('#results');if(list){const items=filtered();list.innerHTML=items.length?items.map(venue).join(''):'<div class="empty">Nenhum estabelecimento encontrado.</div>';const count=app.querySelector('.sectionhead small');if(count)count.textContent=`${items.length} lugares`;list.querySelectorAll('img[data-fallback]').forEach(im=>im.addEventListener('error',()=>{if(!im.dataset.tried){im.dataset.tried='1';im.src=im.dataset.fallback}}))}}if(e.target.id==='new-post')state.post=e.target.value});
app.addEventListener('change',e=>{const k=e.target.dataset.setting;if(k){if(k==='night')state.night=e.target.checked;else state[k]=e.target.checked;persist();render(true)}});
render();
})();
</script></body></html>
