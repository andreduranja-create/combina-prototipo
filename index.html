{display:grid;gap:6px;font-size:12px;font-weight:700}.field input,.field textarea{background:var(--surface);border:1px solid var(--stroke);color:var(--fg);border-radius:12px;padding:12px;min-width:0}.field textarea{resize:vertical}.toggleline{display:flex;justify-content:space-between;align-items:center;gap:14px}.toggleline input{accent-color:#C9422B;width:20px;height:20px}.notice{background:var(--surface);border:1px solid var(--stroke);border-radius:14px;padding:14px;display:grid;gap:6px}.empty{padding:26px;text-align:center;background:var(--surface);border-radius:16px;color:var(--muted);font-size:13px}.disclaimer{font-size:10px;line-height:1.5;color:var(--muted);text-align:center}.back{background:none;border:0;color:var(--fg);font-weight:800;font-size:13px;text-align:left}.detail{padding:15px;background:var(--elev);border-radius:14px;display:grid;gap:9px}.floating{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);padding:12px 18px;background:var(--cta);color:var(--ctatext);border-radius:30px;font-size:12px;font-weight:800;z-index:10;box-shadow:0 4px 25px #0005}@media(min-width:600px){body{padding:20px}#app{height:min(900px,calc(100dvh - 40px));min-height:550px;border:1px solid #75424A;border-radius:25px;overflow:hidden}.top{padding-top:16px}}@media(max-width:365px){.photo{width:90px;height:90px;flex-basis:90px}.place{gap:9px}.brand{font-size:21px}.mode{font-size:9px;padding:0 7px}}@media(prefers-reduced-motion:no-preference){button{transition:transform .16s,opacity .16s}button:active{transform:scale(.97)}}

@media(max-width:599px){#app{height:100dvh;min-height:0}.scroll{overflow-y:auto}}

/* Tomato Social — Design System 2.0: única fonte de cores Day e After Dark. */
#app{color-scheme:dark}
#app.day{color-scheme:light}
#app .top{border-bottom-color:var(--stroke)}
#app .brand{color:var(--fg)}
#app .brand b{color:var(--lime)}
#app .cat.on,#app .chip.on{box-shadow:0 2px 8px #0001}
#app .btn:not(.outline){box-shadow:0 2px 0 #0001}
#app .place,#app .panel,#app .review,#app .topitem{box-shadow:0 3px 16px #0000000c}
#app.night .place,#app.night .panel,#app.night .review,#app.night .topitem{box-shadow:none}
#app .nav.active{color:var(--lime)}
#app .nav.create .plus{background:var(--cta);color:var(--ctatext)}
#app .level{color:var(--gold)}
#app.day .level{color:var(--purple)}
#app .progress span{background:var(--gold)}
#app .menuitem span{color:var(--lime)}
#app .heart.on{color:var(--terra)}
#app button:focus-visible,#app input:focus-visible,#app textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#app .photo{background:var(--elev)}
#app.day .bottom{box-shadow:0 -4px 15px #5b28150b}

/* COMBINA? — TOMATO SOCIAL PREMIUM: Day + After Dark.
   Visual skin only; retains original behavior, venue data and navigation. */
#app.night {
 --bg:#190D10;--surface:#26151A;--elev:#381B22;--fg:#FFF1DA;
 --muted:#D1B5A4;--stroke:#674043;--lime:#EBC785;--purple:#8D2335;
 --gold:#F0C477;--terra:#CC6454;--cta:#AA3D44;--ctatext:#FFF8ED;
 background:radial-gradient(ellipse at 93% 2%,#401923 0,transparent 34%),var(--bg);
}
#app.day {
 --bg:#FBF4E9;--surface:#FFFCF7;--elev:#F6E8D7;--fg:#481A23;
 --muted:#795E60;--stroke:#E8D7BE;--lime:#7F142C;--purple:#7F142C;
 --gold:#B47732;--terra:#B95244;--cta:#851D35;--ctatext:#FFF9EF;
 background:linear-gradient(145deg,#FFFBF6,#FBF1E3 65%,#FFF8F1);
}
#app {font-family:'DM Sans',sans-serif}
#app h1,#app h2,#app .brand-word,#app .profiletop h2 {font-family:Georgia,'Times New Roman',serif;letter-spacing:-.4px;font-weight:700}
#app h1{font-size:28px}#app h2{font-size:22px}
#app .top {background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(15px);border-color:var(--stroke);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;min-height:77px}
#app .brand {display:flex;align-items:center;gap:8px;letter-spacing:0;min-width:0}
#app .crest {height:46px;width:39px;flex-shrink:0;color:var(--fg);overflow:visible}
#app .brand-word {font-size:23px;white-space:nowrap;line-height:1}
#app .brand-word b{color:var(--terra)}
#app .controls{gap:5px}
#app .mode{font-size:10px;border-radius:100px;padding:0 8px;max-width:96px}
#app .iconbutton{width:35px;min-width:35px;height:35px;border-radius:12px}
#app .content{padding:22px 16px 34px;gap:18px}
#app .premium-intro {display:grid;gap:4px}
#app .premium-intro h1 {font-size:29px}
#app .premium-intro .eyebrow {text-transform:uppercase;letter-spacing:1.8px;font-size:10px;color:var(--gold);font-weight:800}
#app .search{border-radius:18px;height:52px;box-shadow:0 4px 24px #2C0A1110}
#app .cats{padding:1px 0 4px}
#app .cat{padding:10px 13px;border-radius:13px;font-weight:700}
#app .cat.on,#app .chip.on{background:var(--cta);border-color:var(--cta);color:var(--ctatext)}
#app .place{border-radius:18px;min-height:124px;box-shadow:0 8px 22px #2c0a1114;gap:12px}
#app .photo {width:104px;height:104px;flex-basis:104px}
#app .placeinfo h3{font-family:Georgia,'Times New Roman',serif;font-size:17px}
#app .btn{border-radius:13px}
#app .btn:not(.outline){background:linear-gradient(125deg,var(--cta),color-mix(in srgb,var(--cta) 77%,#BD684B));color:var(--ctatext)}
#app .btn.outline{border-color:var(--stroke)}
#app .bottom{background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--stroke);padding-top:9px}
#app .nav.active{color:var(--terra)}
#app.day .nav.active{color:var(--cta)}
#app .nav.create .plus{background:linear-gradient(135deg,#E77F58,#A62D38);border-radius:50%;color:white;border:1px solid #E9A073;box-shadow:0 2px 12px #32070D2B}
#app .panel,#app .xp,#app .review,#app .topitem {border-radius:19px;border:1px solid var(--stroke)}
#app .profile-panel{background:transparent;border:0;box-shadow:none;padding:2px 0 14px;gap:14px}
#app .profile-panel .profiletop{flex-direction:column;text-align:center;gap:9px}
#app .profile-panel .avatar{border-radius:50%;width:88px;height:88px;flex-basis:88px;background:linear-gradient(140deg,#F4D5AC,#B64D40);color:#531B24;border:3px solid var(--gold);box-shadow:0 6px 22px #210A1328;font-family:Georgia,serif}
#app .profile-panel .profiletop h2{font-size:29px}
#app .profile-panel .bio,#app .profile-panel .location{text-align:center}
#app .profile-panel .stats{border:0;margin:3px 0}
#app .stats b{font-size:23px;font-family:Georgia,serif}
#app .stats small{font-size:11px}
#app .xp{background:var(--surface);padding:15px}
#app .progress{height:9px;background:var(--elev)}
#app .progress span{background:linear-gradient(90deg,#C96A4A,#F0C477)}
#app .topitem img{height:116px}
#app .topitem .body strong{font-family:Georgia,serif;font-size:13px}
#app .review{box-shadow:0 4px 18px #2C0A110A}
#app .stars{color:var(--gold)}
#app .mode:focus-visible,#app button:focus-visible,#app input:focus-visible,#app textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app .mode,#app .iconbutton,#app .seg button,#app .chip {color:var(--fg)}
#app .menuitem span,#app .level {color:var(--gold)}
#app.day .level {color:var(--cta)}
#app.day .bottom{box-shadow:0 -7px 22px #4A1B1B0A}
@media(max-width:365px){#app .brand-word{font-size:19px}#app .crest{height:39px;width:33px}#app .top{padding-left:10px;padding-right:10px}#app .mode{font-size:9px;padding:0 6px}#app .photo{width:90px;height:90px;flex-basis:90px}}

/* Explore Premium — approved editorial composition */
#app .explore-top{height:72px;min-height:72px;display:flex;justify-content:space-between;align-items:center;border-bottom:0;padding:calc(8px + env(safe-area-inset-top)) 18px 8px}
#app .explore-menu-button{justify-self:start;appearance:none;border:0;background:transparent;color:var(--fg);font-size:24px;padding:8px;line-height:1}
#app .explore-crest{justify-self:center;display:flex;align-items:center;justify-content:center}
#app .explore-crest .crest{height:48px;width:45px}
#app .explore-notification{justify-self:end;border:0;background:transparent;color:var(--fg)}
#app .explore-menu-panel{position:absolute;z-index:10;top:76px;left:max(calc((100vw - 470px)/2 + 16px),16px);display:grid;gap:2px;background:var(--surface);border:1px solid var(--stroke);border-radius:15px;padding:8px;box-shadow:0 12px 35px #0005}
#app .explore-menu-panel button{border:0;background:transparent;text-align:left;padding:10px 14px;color:var(--fg);font-weight:600}
#app .explore-heading{display:grid;gap:2px}
#app .explore-heading h1{font-size:30px}
#app .explore-heading p{font-size:12px;color:var(--muted)}
#app .explore-search{background:var(--elev);height:49px;border-radius:20px}
#app .explore-search svg{height:19px;width:19px}
#app .explore-categories{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#app .explore-cat{min-height:76px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;padding:7px 2px;border:1px solid var(--stroke);border-radius:15px;background:var(--surface);color:var(--fg);font-size:10px;font-weight:700;min-width:0}
#app .explore-cat-ico{font-size:25px;line-height:1.15;color:var(--gold);filter:saturate(.8)}
#app .explore-cat.selected{border-color:var(--gold);background:var(--elev)}
#app .explore-switch{background:linear-gradient(135deg,#87313D,#A94B42);color:#FFF3E6;border-color:#C26B59}
#app .explore-switch .explore-cat-ico{color:#FFF3E6}
#app .feature-card{height:252px;min-height:230px;position:relative;overflow:hidden;border-radius:17px;border:1px solid var(--gold);background:var(--elev)}
#app .feature-card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#app .feature-shade{position:absolute;inset:0;background:linear-gradient(180deg,#14040806 10%,#160A0E44 43%,#100608ED 100%)}
#app .feature-label{position:absolute;top:13px;left:12px;background:linear-gradient(90deg,#EEC781,#A8544B);color:#321218;font-size:11px;font-weight:800;padding:6px 10px;border-radius:100px}
#app .feature-fav,#app .near-fav{position:absolute;top:11px;right:11px;background:#231014B0;color:#FFF1DA;border:0;width:36px;height:36px;border-radius:50%;font-size:23px;display:grid;place-items:center}
#app .feature-fav.on,#app .near-fav.on{color:#F6B36A}
#app .feature-info{position:absolute;bottom:0;left:0;right:0;padding:16px 13px 12px;color:#FFF4E6;display:grid;gap:5px}
#app .feature-info h2{color:#FFF4E6;font-size:26px}
#app .feature-info p{font-size:11px;color:#F5DDD4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#app .feature-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:#F6CB82}
#app .feature-open{justify-self:start;border:0;background:none;color:#FFF4E6;text-decoration:underline;text-underline-offset:2px;padding:4px 0 0;font-size:11px;font-weight:700}
#app .feature-dots{display:flex;justify-content:center;gap:7px;margin:-9px 0 -6px}
#app .feature-dots span{height:6px;width:6px;background:var(--stroke);border-radius:50%}
#app .feature-dots .on{background:var(--gold)}
#app .near-heading h2{font-size:22px}
#app .link-text{font-size:12px;font-weight:700;color:var(--gold);background:none;border:0}
#app.day .link-text{color:var(--cta)}
#app .near-strip{display:flex;overflow:auto;gap:10px;scroll-snap-type:x mandatory;padding:1px 0 6px;scrollbar-width:thin}
#app .near-card{position:relative;min-width:154px;width:154px;height:135px;scroll-snap-align:start;overflow:hidden;border:1px solid var(--stroke);border-radius:14px;background:var(--surface)}
#app .near-card img{width:100%;height:100%;object-fit:cover}
#app .near-card::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#0B0608D9);pointer-events:none}
#app .near-fav{width:29px;height:29px;font-size:18px;right:7px;top:7px;z-index:1}
#app .near-open{position:absolute;bottom:0;left:0;z-index:2;display:grid;gap:3px;width:100%;padding:20px 9px 9px;text-align:left;border:0;background:transparent;color:white}
#app .near-open strong{font-family:Georgia,serif;font-size:15px}
#app .near-open small{color:#F4E1D6;font-size:10px}
#app .explore-caption{font-size:10px;color:var(--muted)}
#app .all-places-head{margin-top:6px}
#app .clear-filter{justify-self:start;border:1px solid var(--stroke);background:var(--surface);color:var(--fg);padding:9px 12px;border-radius:30px;font-size:12px}
#app.day .feature-card{box-shadow:0 10px 30px #38141820}
#app .explore-heading,.explore-categories,.feature-card,.near-strip{min-width:0}
@media(max-width:365px){#app .explore-categories{gap:5px}#app .explore-cat{font-size:9px;min-height:70px}#app .near-card{min-width:140px;width:140px}}


#app .explore-brand{justify-self:start;flex:0 1 auto;gap:7px}

</style></head><body><div id="app"><div style="padding:24px;color:#fff">Carregando Combina?…</div></div><script>window.addEventListener('error',function(e){var el=document.getElementById('app');if(el&&!el.querySelector('.top'))el.innerHTML='<div style="padding:25px;color:white"><h2>Não foi possível iniciar o Combina?</h2><p>Recarregue a página. Se persistir, copie a mensagem abaixo.</p><pre style="white-space:pre-wrap">'+String(e.message).replace(/</g,'&lt;')+'</pre></div>';});</script><script>
(()=>{
/* Combina? — protótipo acadêmico. Dados e avaliações fictícios. */
const PLACES=[
{id:'bottega',name:'Bottega 73',cat:'Italiana',area:'Porto Alegre',image:'photo-1473093295043-cdd812d0e601',emoji:'🍝',desc:'Ambiente acolhedor e cozinha italiana contemporânea. Exemplo ilustrativo do protótipo.'},
{id:'vicolo',name:'Il Vicolo',cat:'Bares',area:'Porto Alegre',image:'photo-1514933651103-005eec06c04b',emoji:'🍷',desc:'Ambiente de bar e encontros. Exemplo ilustrativo do protótipo.'},
{id:'ravello',name:'Bar Ravello',cat:'Bares',area:'Porto Alegre',image:'photo-1536935338788846bb9981813',emoji:'🍸',desc:'Drinks e experiências noturnas. Exemplo ilustrativo do protótipo.'},
{id:'nono',name:'Nono Ludovico',cat:'Pizza',area:'Petrópolis',image:'photo-1513104890138-7c749659a591',emoji:'🍕',desc:'Pizzas tradicionais e sabores especiais para compartilhar.'},

{id:'peppo',name:'Peppo Cucina',cat:'Italiana',area:'Moinhos de Vento',image:'photo-1552566626-52f8b828add9',emoji:'🍝',desc:'Cozinha italiana e ambiente acolhedor.'},
{id:'agridoce',name:'Agridoce Café',cat:'Cafés',area:'Cidade Baixa',image:'photo-1501339847302-ac426a4a7cbb',emoji:'🥐',desc:'Café, doces e ambiente cheio de personalidade.'},
{id:'atelier',name:'Atelier de Massas',cat:'Italiana',area:'Centro Histórico',image:'photo-1473093295043-cdd812d0e601',emoji:'🍝',desc:'Massas italianas e arte em um só lugar.'},
{id:'severo',name:'Severo Burger',cat:'Hambúrguer',area:'Porto Alegre',image:'photo-1568901346375-23c9450c58cd',emoji:'🍔',desc:'Hambúrgueres e experiências descontraídas.'},
{id:'eat',name:'Eat Kitchen',cat:'Brunch',area:'Porto Alegre',image:'photo-1533089860892-a7c6f0a88666',emoji:'🥞',desc:'Culinária contemporânea e encontros.'},
{id:'ofertorio',name:'Ofertório Gastrobar',cat:'Bares',area:'São Geraldo',image:'photo-1514933651103-005eec06c04b',emoji:'🍹',desc:'Drinks e gastronomia para o próximo rolê.'},
{id:'cia',name:'Cia do Sabor',cat:'Pizza',area:'Auxiliadora',image:'photo-1574071318508-1cdbab80d002',emoji:'🍕',desc:'Pizzas, massas e experiências em grupo.'},
{id:'cantina',name:'Cantina Pastasciutta',cat:'Italiana',area:'São João',image:'photo-1551183053-bf91a1d81141',emoji:'🍝',desc:'Cantina italiana com massas e ambiente temático.'}
];
const REVIEWS=[{id:'r1',name:'Peppo Cucina',date:'Há 2 dias',stars:5,likes:18,comments:3,shares:2,text:'Uma noite deliciosa! A massa estava impecável e o atendimento fez toda a diferença.'},{id:'r2',name:'Press Café',date:'Há 5 dias',stars:5,likes:46,comments:12,shares:8,text:'Café excelente, ambiente acolhedor e perfeito para encontrar os amigos.'},{id:'r3',name:'Nono Ludovico',date:'Há 1 semana',stars:5,likes:124,comments:28,shares:17,text:'Uma experiência que merece entrar no Top 5! As pizzas surpreenderam.'},{id:'r4',name:'Agridoce Café',date:'Há 2 semanas',stars:4,likes:87,comments:19,shares:11,text:'Um cantinho cheio de personalidade, ótimo para uma tarde tranquila.'}];
const storageKey='cmb-demo-v1';let stored={};try{stored=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}
const defaultProfile={name:'Ana Martins',username:'ana.explora',bio:'Comida boa, conversa longa e lugares que dão vontade de voltar. ☕ 🍝',city:'Porto Alegre, RS',interests:['Italiana','Cafés','Brunch']};
const state={tab:'Explorar',section:'main',night:stored.night??true,cat:'Todos',search:'',favs:stored.favs||[],profile:{...defaultProfile,...stored.profile},draft:null,sort:'recent',allReviews:false,detail:null,unread:stored.unread??3,social:stored.social??true,private:stored.private??false,post:'',showToast:'',exploreMenu:false};
const app=document.getElementById('app');function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function persist(){try{localStorage.setItem(storageKey,JSON.stringify({night:state.night,favs:state.favs,profile:state.profile,unread:state.unread,social:state.social,private:state.private}))}catch(e){}}
function imgUrl(p,w=520){return `https://images.unsplash.com/${p.image}?auto=format&fit=crop&w=${w}&q=75`}
function fallback(emoji){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360"><rect width="360" height="360" fill="#48232C"/><circle cx="180" cy="180" r="115" fill="#C9422B"/><text x="180" y="212" font-size="100" text-anchor="middle">${emoji}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function photo(p,w=520){return `<img class="photo" loading="lazy" src="${imgUrl(p,w)}" alt="Fotografia gastronômica ilustrativa de ${h(p.cat)}" data-fallback="${fallback(p.emoji)}">`}
function crest(){return `<svg class="crest" viewBox="0 0 72 86" role="img" aria-label="Escudo Combina?"><g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 23 36 16 60 23v33Q56 69 36 81 16 69 12 56Z"/><path d="M24 10 20 5 27 8 36 2 45 8 52 5 48 10v4H24Z" stroke-width="2.4"/><path d="M8 49Q3 62 18 76M64 49Q69 62 54 76" stroke-width="2.6"/><path d="M9 57 3 52M11 64 3 62M15 70 6 70M63 57l6-5M61 64l8-2M57 70l9 0" stroke-width="2.3"/></g><g fill="currentColor"><g transform="translate(5 0)"><path d="M25 32v16q0 5 5 6v17h-4V54q-5-2-5-7V32h2v14h2V32h2v14h2V32h2v15q0 6-4 8v16h-2Z"/></g><g transform="translate(-5 0)"><path d="M47 31Q55 38 55 48V52Q54 56 50 57V72h-5V32Q45 31 47 31Z"/></g></g></svg>`}
function icon(name){const p={search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',map:'<path d="m3 5 6-3 6 3 6-3v17l-6 3-6-3-6 3zM9 2v17m6-14v17"/>',plus:'<path d="M12 4v16M4 12h16"/>',bookmark:'<path d="M5 3h14v19l-7-5-7 5z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',back:'<path d="m15 18-6-6 6-6"/>'};return `<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||p.search}</svg>`}
function filtered(){return PLACES.filter(p=>(state.cat==='Todos'||p.cat===state.cat||(state.cat==='Restaurantes'&&['Pizza','Italiana','Hambúrguer'].includes(p.cat))||(state.cat==='Experiências'&&['Brunch','Cafés'].includes(p.cat)))&&(`${p.name} ${p.cat} ${p.area}`.toLowerCase().includes(state.search.toLowerCase()))&&(state.tab!=='Salvos'||state.favs.includes(p.id)))}
function venue(p){return `<article class="place">${photo(p,280)}<div class="placeinfo"><div class="placeheading"><h3>${h(p.name)}</h3><button class="heart ${state.favs.includes(p.id)?'on':''}" data-action="fav" data-id="${p.id}" aria-label="${state.favs.includes(p.id)?'Remover dos':'Adicionar aos'} favoritos">${state.favs.includes(p.id)?'♥':'♡'}</button></div><small>${h(p.cat)} · ${h(p.area)}</small><button class="btn outline small full" data-action="detail" data-id="${p.id}">Ver detalhes</button></div></article>`}
function featureCard(p){return `<article class="feature-card"><img src="${imgUrl(p,800)}" loading="lazy" alt="Foto gastronômica ilustrativa" data-fallback="${fallback(p.emoji)}"><div class="feature-shade"></div><span class="feature-label">${state.night?'✦ Destaque da noite':'✦ Destaque do dia'}</span><button class="feature-fav ${state.favs.includes(p.id)?'on':''}" data-action="fav" data-id="${p.id}" aria-label="${state.favs.includes(p.id)?'Remover favorito':'Adicionar favorito'}">${state.favs.includes(p.id)?'♥':'♡'}</button><div class="feature-info"><h2>${h(p.name)}</h2><p>${h(p.desc)}</p><div class="feature-meta"><span>★ Destaque gastronômico</span><span>·</span><span>${h(p.cat)}</span></div><button class="feature-open" data-action="detail" data-id="${p.id}">Ver detalhes →</button></div></article>`}
function nearbyCard(p){return `<article class="near-card"><img src="${imgUrl(p,420)}" loading="lazy" alt="Foto ilustrativa de ${h(p.cat)}" data-fallback="${fallback(p.emoji)}"><button class="near-fav ${state.favs.includes(p.id)?'on':''}" data-action="fav" data-id="${p.id}" aria-label="Favoritar">${state.favs.includes(p.id)?'♥':'♡'}</button><button class="near-open" data-action="detail" data-id="${p.id}"><strong>${h(p.name)}</strong><small>${h(p.cat)} · ${h(p.area)}</small></button></article>`}
function explore(){const items=filtered(),isExplore=state.tab==='Explorar',normal=isExplore&&state.cat==='Todos'&&!state.search.trim();const featured=PLACES.find(p=>p.id==='bottega');const nearby=['vicolo','ravello','ofertorio','agridoce'].map(id=>PLACES.find(p=>p.id===id)).filter(Boolean);return `<div class="explore-heading"><h1>${isExplore?'Explorar':'Meus salvos'}</h1><p>${isExplore?'Restaurantes · Bares · Experiências':'Os lugares que você guardou'}</p></div>${isExplore?`<label class="search explore-search"><span>${icon('search')}</span><input id="search" placeholder="Buscar lugares, culinárias, experiências..." autocomplete="off" value="${h(state.search)}" aria-label="Buscar estabelecimento"></label><div class="explore-categories">${[['Restaurantes','🍴'],['Bares','🍸'],['Experiências','♧']].map(([cat,i])=>`<button class="explore-cat ${state.cat===cat?'selected':''}" data-action="cat" data-id="${cat}"><span class="explore-cat-ico">${i}</span><span>${cat}</span></button>`).join('')}<button class="explore-cat explore-switch" data-action="theme"><span class="explore-cat-ico">${state.night?'☀':'☾'}</span><span>${state.night?'Day':'After Dark'}</span></button></div>`:''}${normal?`${featureCard(featured)}<div class="feature-dots" aria-hidden="true"><span></span><span class="on"></span><span></span></div><div class="sectionhead near-heading"><h2>Perto de você</h2><button class="link-text" data-action="allplaces">Ver todos ›</button></div><div class="near-strip">${nearby.map(nearbyCard).join('')}</div><p class="explore-caption">Locais e imagens ilustrativos. Distâncias e avaliações reais não estão conectadas.</p>`:''}${!normal?`<div class="sectionhead"><h2>${isExplore?'Resultados':'Favoritos'}</h2><small>${items.length} lugares</small></div>`: `<div class="sectionhead all-places-head"><h2>Descubra mais</h2><small>${items.length} lugares</small></div>`}${isExplore&&state.cat!=='Todos'? `<button class="clear-filter" data-action="reset">× Limpar filtro: ${h(state.cat)}</button>`:''}<div class="items" id="results">${items.length?items.map(venue).join(''):`<div class="empty">Nenhum estabelecimento encontrado.<button class="btn" data-action="reset">Ver todos</button></div>`}</div>${state.detail&&PLACES.some(p=>p.id===state.detail)?`<div class="detail"><div class="flexbetween"><h3>${h(PLACES.find(p=>p.id===state.detail).name)}</h3><button class="btn outline small" data-action="closeDetail">Fechar</button></div><p>${h(PLACES.find(p=>p.id===state.detail).desc)}</p><small>Informações demonstrativas; não representam dados verificados.</small></div>`:''}<div class="disclaimer">Fotografias ilustrativas. Os dados de estabelecimentos e avaliações deste protótipo não foram verificados.</div>`}
function profile(){const p=state.profile;const ordered=state.sort==='recent'?REVIEWS:[...REVIEWS].sort((a,b)=>(b.likes+b.comments+b.shares)-(a.likes+a.comments+a.shares));return `<section class="panel profile-panel"><div class="profiletop"><div class="avatar">${h(p.name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase())}</div><div><h2>${h(p.name)}</h2><small>@${h(p.username)}</small><div class="level">✦ Exploradora local · nível 8</div></div></div><p class="bio">${h(p.bio)}</p><span class="location">⌖ ${h(p.city)}</span><div><strong style="font-size:12px">Combina comigo</strong><div class="tags" style="margin-top:9px">${p.interests.map(t=>`<span>${h(t)}</span>`).join('')}</div></div><div class="stats"><div><b>128</b><small>Publicações</small></div><div><b>842</b><small>Seguidores</small></div><div><b>376</b><small>Seguindo</small></div></div><div class="actions"><button class="btn" data-action="edit">Editar perfil</button><button class="btn outline" data-action="share">Compartilhar</button></div></section><div class="xp"><div class="flexbetween"><strong>🏅 Rumo ao nível 9</strong><small>680 / 1.000 XP</small></div><div class="progress"><span></span></div><small>Faltam 320 XP para o próximo nível.</small></div><div class="sectionhead"><h2>Meu top 5</h2><button class="btn outline small" data-action="top">Ver todos</button></div><div class="toplist">${PLACES.slice(0,2).map((x,i)=>`<div class="topitem"><img src="${imgUrl(x,360)}" loading="lazy" data-fallback="${fallback(x.emoji)}" alt="Imagem gastronômica ilustrativa"><div class="body"><strong>0${i+1} · ${h(x.name)}</strong><small>${x.cat}</small></div></div>`).join('')}</div><h2>Minhas avaliações</h2><div class="seg"><button class="${state.sort==='recent'?'on':''}" data-action="sort" data-id="recent">Últimas</button><button class="${state.sort==='popular'?'on':''}" data-action="sort" data-id="popular">Mais engajamento</button></div><small>${state.sort==='popular'?'Ordenadas pela soma de curtidas, comentários e compartilhamentos.':'Ordenadas da mais recente para a mais antiga.'}</small>${(state.allReviews?ordered:ordered.slice(0,2)).map(r=>`<article class="review"><div class="meta"><div><h3>${h(r.name)}</h3><small>${r.date}</small><div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div></div>${state.sort==='popular'&&r===ordered[0]?'<span>🏆</span>':''}</div><p class="bio">“${h(r.text)}”</p><div class="metrics"><span class="metric">♡ ${r.likes}</span><span class="metric">☏ ${r.comments}</span><span class="metric">↗ ${r.shares}</span><button class="btn outline small" data-action="review" data-id="${r.id}" style="margin-left:auto">Detalhes</button></div>${state.detail===r.id?`<div class="detail"><strong>${r.likes+r.comments+r.shares} interações</strong><small>Dados demonstrativos de engajamento.</small></div>`:''}</article>`).join('')}<button class="btn outline full" data-action="allreviews">${state.allReviews?'Mostrar menos':'Ver todas as avaliações'}</button><p class="disclaimer">Perfil, avaliações e métricas sociais são fictícios.</p>`}
function settings(){return `<button class="back" data-action="back">‹ Voltar ao perfil</button><h1>Configurações</h1><p class="hint">Gerencie seus dados e preferências.</p><h2>Minha conta</h2><button class="menuitem" data-action="edit"><span>✎</span><div>Editar perfil<br><small>Nome, biografia, cidade e interesses</small></div><span style="margin-left:auto">›</span></button><h2>Preferências</h2><div class="panel"><label class="toggleline">Modo After Dark <input type="checkbox" data-setting="night" ${state.night?'checked':''}></label><label class="toggleline">Notificações sociais <input type="checkbox" data-setting="social" ${state.social?'checked':''}></label><label class="toggleline">Perfil privado <input type="checkbox" data-setting="private" ${state.private?'checked':''}></label></div><p class="disclaimer">Preferências locais, exclusivas deste navegador.</p>`}
function edit(){const p=state.draft;return `<button class="back" data-action="settings">‹ Configurações</button><h1>Editar perfil</h1><div class="panel"><label class="field">Nome <input id="edit-name" maxlength="55" value="${h(p.name)}"></label><label class="field">Usuário <input id="edit-username" maxlength="35" value="${h(p.username)}"></label><label class="field">Biografia <textarea id="edit-bio" rows="4" maxlength="220">${h(p.bio)}</textarea></label><label class="field">Cidade <input id="edit-city" maxlength="65" value="${h(p.city)}"></label><div class="field">Combina comigo</div><div class="tags" id="interest-options">${['Italiana','Cafés','Brunch','Pizza','Hambúrguer','Bares','Japonesa'].map(c=>`<button class="chip ${p.interests.includes(c)?'on':''}" data-action="interest" data-id="${c}">${c}</button>`).join('')}</div><button class="btn full" data-action="saveProfile">Salvar alterações</button><button class="btn outline full" data-action="settings">Cancelar</button></div>`}
function notifications(){return `<div class="flexbetween"><h1>Notificações</h1><button class="btn outline small" data-action="read">Marcar lidas</button></div>${[['🏆','Nova conquista disponível','Você está perto do nível 9.'],['♡','Curtidas na avaliação','Sua publicação recebeu interações.'],['☏','Novo comentário','Alguém comentou sua experiência.']].map(n=>`<div class="notice"><strong>${n[0]} ${n[1]}</strong><small>${n[2]}</small></div>`).join('')}<p class="disclaimer">Notificações demonstrativas.</p><button class="btn outline" data-action="back">Voltar ao perfil</button>`}
function renderTopFive(){return `<button class="back" data-action="back">‹ Voltar ao perfil</button><h1>Meu top 5</h1>${PLACES.slice(0,5).map((p,i)=>`<div class="place">${photo(p,220)}<div><h3>${i+1}. ${h(p.name)}</h3><small>${p.cat}</small></div></div>`).join('')}`}
function section(){if(state.tab==='Explorar'||state.tab==='Salvos')return explore();if(state.tab==='Mapa')return `<h1>Mapa</h1><div class="empty">🗺️<br><br>Mapa interativo previsto para a próxima etapa.<br><br><button class="btn" data-action="explore">Explorar estabelecimentos</button></div>`;if(state.tab==='Criar')return `<h1>Nova publicação</h1><p class="hint">Compartilhe suas descobertas gastronômicas.</p><label class="field">Sua experiência<textarea id="new-post" rows="6" placeholder="Qual lugar combinou com você?">${h(state.post)}</textarea></label><button class="btn full" data-action="post">Continuar</button><p class="disclaimer">O protótipo não publica dados online.</p>`;if(state.section==='settings')return settings();if(state.section==='edit')return edit();if(state.section==='notifications')return notifications();if(state.section==='top')return renderTopFive();if(state.section==='share')return `<button class="back" data-action="back">‹ Voltar</button><h1>Compartilhar perfil</h1><p class="hint">Perfil fictício de demonstração.</p><button class="btn" data-action="copy">Copiar link demonstrativo</button>`;return profile()}
function render(keepScroll=false){const y=keepScroll?(app.querySelector('.scroll')?.scrollTop||0):0;app.className=state.night?'night':'day';app.innerHTML=`<header class="top ${state.tab==='Explorar'?'explore-top':''}">${state.tab==='Explorar'?`<div class="brand explore-brand">${crest()}<span class="brand-word">Combina<b>?</b></span></div><div class="explore-top-actions"><button class="explore-menu-button" data-action="exploremenu" aria-label="Abrir menu">☰</button><button class="iconbutton explore-notification" data-action="notifications" aria-label="Notificações">${icon('bell')}${state.unread?`<span class="dot">${state.unread}</span>`:''}</button></div>`:`<div class="brand">${crest()}<span class="brand-word">Combina<b>?</b></span></div><div class="controls"><button class="mode" data-action="theme" title="Alternar aparência">${state.night?'☾ After Dark':'☀ Day'}</button><button class="iconbutton" data-action="notifications" aria-label="Notificações">${icon('bell')}${state.unread?`<span class="dot">${state.unread}</span>`:''}</button><button class="iconbutton" data-action="settings" aria-label="Configurações">${icon('settings')}</button></div>`}</header>${state.tab==='Explorar'&&state.exploreMenu?`<div class="explore-menu-panel"><button data-action="nav" data-id="Perfil">Meu perfil</button><button data-action="nav" data-id="Salvos">Salvos</button><button data-action="theme">${state.night?'Ativar Day':'Ativar After Dark'}</button></div>`:''}<main class="scroll"><div class="content">${section()}</div></main><nav class="bottom" aria-label="Navegação principal">${[['Explorar','search'],['Mapa','map'],['Criar','plus'],['Salvos','bookmark'],['Perfil','user']].map(([t,i])=>`<button class="nav ${state.tab===t?'active':''} ${t==='Criar'?'create':''}" data-action="nav" data-id="${t}" aria-label="${t}">${t==='Criar'?`<span class="plus">${icon('plus')}</span>`:`${icon(i)}<span>${t}</span>`}</button>`).join('')}</nav>`;app.querySelector('.scroll').scrollTop=y;app.querySelectorAll('img[data-fallback]').forEach(im=>im.addEventListener('error',()=>{if(!im.dataset.tried){im.dataset.tried='1';im.src=im.dataset.fallback}}))}
function toast(s){const old=app.querySelector('.floating');if(old)old.remove();const t=document.createElement('div');t.className='floating';t.textContent=s;app.appendChild(t);setTimeout(()=>t.remove(),2600)}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;if(act==='exploremenu'){state.exploreMenu=!state.exploreMenu;render(true);return}if(act==='allplaces'){const target=app.querySelector('.all-places-head');target?.scrollIntoView({block:'start',behavior:'smooth'});return}if(act==='nav'){state.exploreMenu=false;state.tab=id;state.section='main';state.detail=null;render();return}if(act==='theme'){state.exploreMenu=false;state.night=!state.night;persist();render(true);return}if(act==='settings'||act==='notifications'){state.tab='Perfil';state.section=act;render();return}if(act==='back'){state.tab='Perfil';state.section='main';render();return}if(act==='cat'){state.cat=id;render(true);return}if(act==='reset'||act==='explore'){state.tab='Explorar';state.cat='Todos';state.search='';render();return}if(act==='fav'){state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];persist();render(true);return}if(act==='detail'||act==='review'){state.detail=state.detail===id?null:id;render(true);return}if(act==='closeDetail'){state.detail=null;render(true);return}if(act==='sort'){state.sort=id;state.allReviews=false;state.detail=null;render(true);return}if(act==='allreviews'){state.allReviews=!state.allReviews;render(true);return}if(act==='edit'){state.draft=JSON.parse(JSON.stringify(state.profile));state.tab='Perfil';state.section='edit';render();return}if(act==='interest'){state.draft.interests=state.draft.interests.includes(id)?state.draft.interests.filter(x=>x!==id):[...state.draft.interests,id];render(true);return}if(act==='saveProfile'){const n=app.querySelector('#edit-name').value.trim(),u=app.querySelector('#edit-username').value.trim().replace(/^@/,'');if(!n||!u){toast('Preencha o nome e o usuário.');return}state.profile={...state.draft,name:n,username:u,bio:app.querySelector('#edit-bio').value,city:app.querySelector('#edit-city').value.trim()};state.section='main';persist();render();toast('Perfil atualizado neste navegador.');return}if(act==='read'){state.unread=0;persist();render(true);return}if(act==='top'||act==='share'){state.section=act;render();return}if(act==='copy'){try{await navigator.clipboard.writeText('https://combina.app/u/ana.explora');toast('Link fictício copiado.')}catch(e){toast('Link fictício: combina.app/u/ana.explora')}return}if(act==='post'){toast('Publicação online indisponível nesta demonstração.');return}});
app.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const list=app.querySelector('#results');if(list){const items=filtered();list.innerHTML=items.length?items.map(venue).join(''):'<div class="empty">Nenhum estabelecimento encontrado.</div>';const count=app.querySelector('.sectionhead small');if(count)count.textContent=`${items.length} lugares`;list.querySelectorAll('img[data-fallback]').forEach(im=>im.addEventListener('error',()=>{if(!im.dataset.tried){im.dataset.tried='1';im.src=im.dataset.fallback}}))}}if(e.target.id==='new-post')state.post=e.target.value});
app.addEventListener('change',e=>{const k=e.target.dataset.setting;if(k){if(k==='night')state.night=e.target.checked;else state[k]=e.target.checked;persist();render(true)}});
render();
})();
